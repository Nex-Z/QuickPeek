[package]
name = "quickpeek"
version = "0.1.19"
edition = "2024"
build = "build.rs"

[dependencies]
windows-registry = "0.5.3"
tempfile = "3"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
roxmltree = "0.20"
mail-parser = { version = "1", features = ["full_encoding"] }
rtf-to-html = "0.1"
windows-reactor = "=0.100.0"
windows = { version = "0.62.2", features = ["Foundation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Media_MediaFoundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
encoding_rs = "0.8"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
url = "2"
windows-webview = { version = "=0.100.0", features = ["reactor"] }
csv = "1.3"
base64 = "0.23"
calamine = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }

[build-dependencies]
windows-reactor-setup = "=0.100.0"
winresource = "0.1"

[profile.release]
panic = "abort"
strip = true
lto = "thin"

[features]
default = ["gpui-preview"]
gpui-preview = ["dep:gpui"]

[dependencies.gpui]
version = "=0.2.2"
default-features = false
optional = true
